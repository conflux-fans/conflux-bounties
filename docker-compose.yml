version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "3001:3001"
    volumes:
      - db-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/dashboard.db
      - METRIC_INTERVAL_MS=5000
      - RETENTION_DAYS=30
      - CONFLUX_CORE_RPC_URLS=https://main.confluxrpc.com,https://test.confluxrpc.com
      - CONFLUX_ESPACE_RPC_URLS=https://evm.confluxrpc.com,https://evmtestnet.confluxrpc.com
      - SEED_DEMO=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
