version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: x402
      POSTGRES_PASSWORD: x402pass
      POSTGRES_DB: x402_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x402"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  seller-api:
    build:
      context: .
      dockerfile: apps/seller-api/Dockerfile
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://x402:x402pass@postgres:5432/x402_db
      REDIS_URL: redis://redis:6379
      API_PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Browser fetches from host network, not Docker internal
      NEXT_PUBLIC_API_BASE: http://localhost:4000
    depends_on:
      - seller-api

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file: .env
    environment:
      # Agent runs inside Docker network — use container hostname
      API_BASE: http://seller-api:4000
    depends_on:
      - seller-api
    profiles:
      - agent  # Only starts with: docker compose --profile agent up

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - seller-api
    profiles:
      - monitoring  # Only starts with: docker compose --profile monitoring up

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: x402admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/x402.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  pgdata:
  promdata:
  grafanadata:
