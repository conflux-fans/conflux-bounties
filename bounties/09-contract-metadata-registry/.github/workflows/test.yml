# Conflux Contract Metadata Registry – CI

name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        working-directory: .
      - run: npm run compile
        working-directory: contracts
      - run: npm test
        working-directory: contracts
        env:
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metadata
          POSTGRES_PASSWORD: metadata
          POSTGRES_DB: metadata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metadata"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        working-directory: shared
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://metadata:metadata@localhost:5432/metadata?schema=public
      - run: npm run test:run
        working-directory: backend
        env:
          DATABASE_URL: postgresql://metadata:metadata@localhost:5432/metadata?schema=public
          REDIS_URL: redis://localhost:6379
          CONFLUX_RPC_URL: https://evmtestnet.confluxrpc.com
          REGISTRY_ADDRESS: 0x0000000000000000000000000000000000000000
          PINATA_JWT: placeholder
          MAX_METADATA_KB: 50
          ALLOWED_LOGO_MIME: image/png,image/jpeg,image/svg+xml

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        working-directory: shared
      - run: npm test
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
        continue-on-error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        working-directory: shared
      - run: npm run test
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/v1
          NEXT_PUBLIC_REGISTRY_ADDRESS: 0x0000000000000000000000000000000000000000
          NEXT_PUBLIC_CONFLUX_RPC_URL: https://evmtestnet.confluxrpc.com
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/v1
          NEXT_PUBLIC_REGISTRY_ADDRESS: 0x0000000000000000000000000000000000000000
          NEXT_PUBLIC_CONFLUX_RPC_URL: https://evmtestnet.confluxrpc.com
        continue-on-error: true

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        working-directory: shared
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: 'true'
          NEXT_PUBLIC_API_URL: http://localhost:3099/v1
          NEXT_PUBLIC_REGISTRY_ADDRESS: 0x0000000000000000000000000000000000000000
          NEXT_PUBLIC_CONFLUX_RPC_URL: https://evmtestnet.confluxrpc.com
