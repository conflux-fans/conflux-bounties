services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gated
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://postgres:postgres@db:5432/gated?schema=public
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gated?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: docker-dev-secret-must-be-32-chars-minimum
      SIWC_DOMAIN: localhost
      NEXT_PUBLIC_SIWC_DOMAIN: localhost
      ADMIN_WALLETS: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Optional: periodic token metadata refresh (enable with: docker compose --profile cron up)
  metadata-cron:
    profiles: ["cron"]
    image: curlimages/curl:8.5.0
    environment:
      CRON_SECRET: ${CRON_SECRET:-please-set-cron-secret-16chars-min}
    depends_on:
      - web
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 900
          curl -sfS -H "Authorization: Bearer $$CRON_SECRET" "http://web:3000/api/cron/metadata-refresh" || true
        done

volumes:
  pgdata:
